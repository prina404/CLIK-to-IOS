[project]
name = "clik-diffusion-ios"
version = "0.1.0"
description = "CLIK-Diffusion tooth alignment prediction, adapted to the 1060-patient intraoral-scan dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "numpy>=1.21.6",
    "scipy>=1.7.3",
    "matplotlib>=3.5.2",
    "trimesh>=3.12.6",
    "natsort>=8.1.0",
    "ipykernel>=7.3.0",
    "open3d>=0.19.0",
    "tqdm>=4.68.4",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "lightning>=2.6.5",
    "wandb>=0.29.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pyright]
extraPaths = ["src", "src/CLIK-Diffusion/Code"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
